[build]
  publish = "dist"
  command = "npm run build"
[build.environment]
  NODE_VERSION = "20"

[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the /mcp function warm and log a latency probe every 5 minutes so
# agents don't pay a cold start (and time out) on first connect. Scheduled
# functions run only on the published production deploy.
[functions."mcp-keepalive"]
  schedule = "*/5 * * * *"


[[redirects]]
  from = "/pdf/*"
  to = "/.netlify/functions/get-public-pdf?blobKey=pdf/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/img/*"
  to = "/.netlify/functions/get-public-image?blobKey=image/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

# W13 (12-plan §5.3): first-party tracking ingest — same-origin, generic
# path (ad-blocker posture). GET ?mode=region doubles as the consent gate's
# region oracle.
[[redirects]]
  from = "/api/t"
  to = "/.netlify/functions/track-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/admin/review/*"
  to = "/admin/review/draft"
  status = 200

[[redirects]]
  from = "/admin/objects/*"
  to = "/admin/objects/lookup"
  status = 200

# T9.9: serve the object workspace for any /admin/content/<id>. status 200
# without force, so the static content library at /admin/content/ and the
# placeholder page itself are not shadowed; only paths with no static file
# (real object ids) rewrite to the workspace, which reads the id client-side.
[[redirects]]
  from = "/admin/content/*"
  to = "/admin/content/__workspace"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/learn/library"
  status = 301

[[redirects]]
  from = "/topics"
  to = "/learn/topics"
  status = 301

[[redirects]]
  from = "/topics/*"
  to = "/learn/topics/:splat"
  status = 301

[[redirects]]
  from = "/shop"
  to = "/solutions/shop-preview"
  status = 301

[[redirects]]
  from = "/early-access"
  to = "/solutions/early-access"
  status = 301
