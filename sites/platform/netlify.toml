# Per-site Netlify config. The redirects here MUST equal this client's
# site.config.ts `redirects` (the drift-guard discipline root netlify.toml and
# sites/drlurie/site.config.ts already share).
#
# W14 T14.3: this file describes a REAL build. Set the Netlify project's BASE
# DIRECTORY to sites/platform — that is what makes Netlify read this
# file instead of the repo-root one. Every path below is then relative to that
# base, and the build command runs with sites/platform as its working
# directory (the shell's astro config, tailwind config, and config.yaml lookups
# are all absolute for exactly this reason).

[build]
  publish = "dist"
  command = "npx astro build --config astro.config.ts"
[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/pdf/*"
  to = "/.netlify/functions/get-public-pdf?blobKey=pdf/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/img/*"
  to = "/.netlify/functions/get-public-image?blobKey=image/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/api/t"
  to = "/.netlify/functions/track-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/admin/content/*"
  to = "/admin/content/__workspace"
  status = 200
  force = true
