# Per-site Netlify config. The redirects here MUST equal this client's
# site.config.ts `redirects` (the drift-guard discipline root netlify.toml and
# sites/drlurie/site.config.ts already share).
#
# W14 T14.2: this file describes a REAL build. Point the Netlify project's base
# directory at sites/platform so Netlify reads this file instead of the
# repo-root one, and it builds this site's entry into this site's dist with this
# site's function shims. Creating the project itself is T14.3 (account
# authority) — see docs/cms-architecture/site-provisioning-runbook.md.

[build]
  # Netlify resolves these against this project's BASE DIRECTORY, which must be
  # set to this site's directory (Site settings -> Build & deploy -> Base
  # directory). The build command runs from the repo root because the monorepo's
  # node_modules and the shared shell live there.
  base = "/"
  publish = "sites/platform/dist"
  command = "npx astro build --config sites/platform/astro.config.ts"
[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "sites/platform/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/pdf/*"
  to = "/.netlify/functions/get-public-pdf?blobKey=pdf/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/img/*"
  to = "/.netlify/functions/get-public-image?blobKey=image/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/api/t"
  to = "/.netlify/functions/track-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/admin/content/*"
  to = "/admin/content/__workspace"
  status = 200
  force = true
